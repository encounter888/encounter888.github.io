<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>encounter888 · Welcome</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 10%, #1e3a8a 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, #4c1d95 0%, transparent 45%),
                  linear-gradient(160deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 48px 40px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 3px solid transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      70%  { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 36px;
    }

    .links a {
      flex: 1 1 160px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.45);
    }

    footer {
      margin-top: 36px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="avatar"
      src="https://avatars.githubusercontent.com/u/234322696?v=4"
      alt="encounter888 头像"
      width="108"
      height="108"
    />

    <h1>Hello, I'm encounter888</h1>

    <p class="subtitle">
      欢迎来到我的 GitHub Pages 主页。<br />
      这里是我的第一个站点，后续会用来展示我的一些小项目。
    </p>

    <span class="badge">
      <span class="dot"></span>
      GitHub Pages 已上线
    </span>

    <nav class="links">
      <a href="https://github.com/encounter888" target="_blank" rel="noopener">GitHub 主页</a>
      <a href="https://github.com/encounter888?tab=repositories" target="_blank" rel="noopener">我的仓库</a>
    </nav>

    <footer>© <span id="year"></span> encounter888 · Powered by GitHub Pages</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
